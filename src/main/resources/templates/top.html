<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{common/head :: head('トップ画面')}">
    <div th:replace="~{common/csrf :: csrf}"></div>
  </head>
  <body class="d-flex flex-column min-vh-100">
    <div th:replace="~{common/navbar :: navbar}"></div>
    <div class="container text-center mt-4 mt-md-6 flex-grow-1">
      <h1 class="fs-2 fs-md-1 fw-bold">トップ画面</h1>
      <div class="my-1 my-md-2 position-fixed top-10 start-50 translate-middle-x z-3 w-80 w-md-50 px-1 px-md-0">
        <div id="shuushiRegistered"
        th:if="${param.shuushiRegistered}"
        class="alert alert-success alert-dismissible fade show small fs-md-5"
        role="alert"
        >
        収支登録が完了しました。
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="閉じる"></button>
        </div>
        <div id="shuushiUpdated"
        th:if="${param.shuushiUpdated}"
        class="alert alert-success alert-dismissible fade show small fs-md-5"
        role="alert"
        >
        収支編集が完了しました。
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="閉じる"></button>
        </div>
      </div>
      <div th:replace="~{common/searchCondition :: searchCondition}"></div>
      <div class="text-center">
        <button type="button" class="btn btn-info" onclick="searchSummary()">検索</button>
      </div>
      <div class="row g-3 align-items-center my-1 my-md-3">
        <div class="col-12 col-md-4">
          <p class="fs-5">購入額合計: <span id="totalKounyuuKingaku" class="fw-bold">-</span></p>
        </div>
        <div class="col-12 col-md-4">
          <p class="fs-5">払戻額合計: <span id="totalHaraimodoshi" class="fw-bold">-</span></p>
        </div>
        <div class="col-12 col-md-4">
          <p class="fs-5">回収率: <span id="kaishuuritsu" class="fw-bold">-</span>%</p>
        </div>
      </div>

      <script th:src="@{/js/top.js}"></script>
      <script th:src="@{/js/searchCondition.js}"></script>

    </div>
    <div th:replace="~{common/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
